<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="w-full max-w-md bg-white p-8 rounded-lg shadow">
    <h2 class="text-2xl font-bold mb-6 text-center">Login to Your Account</h2>
    <form>
      <input type="email" placeholder="Email" class="w-full mb-4 p-2 border rounded">
      <input type="password" placeholder="Password" class="w-full mb-4 p-2 border rounded">
      <button type="button" class="w-full bg-blue-600 text-white py-2 rounded">Login</button>
    </form>
    <div class="flex items-center my-4">
      <hr class="flex-grow border-t">
      <span class="mx-4 text-gray-400">OR</span>
      <hr class="flex-grow border-t">
    </div>
    <button 
      onclick="window.location.href='/auth/google'" 
      class="w-full bg-red-500 text-white py-2 rounded">Sign in with Google</button>
  </div>
</body>
</html>
