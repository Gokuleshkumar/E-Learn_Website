services:
  - type: web
    name: ags-ai-discuss
    runtime: python
    region: singapore
    plan: free
    rootDir: AI_Education_Mini_project/Gemini_AI_Tutor
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_API_KEY
        sync: false
