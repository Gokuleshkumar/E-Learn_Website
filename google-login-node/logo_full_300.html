<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@800&family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 300px;
    height: 300px;
    background: #141417;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Sora', sans-serif;
  }
  .icon-wrap {
    margin-top: -12px;
    margin-bottom: 12px;
  }
  svg {
    width: 108px;
    height: 108px;
  }
  .brand-text {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .brand-text .ags {
    color: #ffffff;
  }
  .brand-text .academy {
    color: #7C3AED;
  }
  .sub-tag {
    margin-top: 6px;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: #8B899A;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="icon-wrap">
    <svg xmlns="http://www.svg.org/2000/svg" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3b82f6" />
          <stop offset="100%" stop-color="#1d4ed8" />
        </linearGradient>
      </defs>
      <path d="M20 70 L45 20 L70 70 M32 45 L58 45" stroke="url(#grad1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <circle cx="45" cy="20" r="8" fill="#1d4ed8" />
      <circle cx="20" cy="70" r="8" fill="#3b82f6" />
      <circle cx="70" cy="70" r="8" fill="#3b82f6" />
    </svg>
  </div>
  <div class="brand-text">
    <span class="ags">AGS</span>
    <span class="academy">Academys</span>
  </div>
  <div class="sub-tag">Tech Education</div>
</body>
</html>
