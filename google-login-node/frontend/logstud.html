<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login - AGS Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Inter', sans-serif;
      padding: 1rem;
    }

    /* Professional card */
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      margin-top: 1rem;
    }

    /* Horizontal scrolling ticker */
    .ticker-container {
      overflow: hidden;
      white-space: nowrap;
      width: 100%;
      border-left: 4px solid #6366f1;
      background: #f0f0f0;
      border-radius: 6px;
      margin-bottom: 1rem;
      padding-left: 1rem;
    }

    .ticker-content {
      display: inline-block;
      padding-right: 100%;
      animation: scroll-left 30s linear infinite;
      font-weight: 500;
      color: #111827;
    }

    .ticker-container:hover .ticker-content {
      animation-play-state: paused;
    }

    @keyframes scroll-left {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Eye toggle */
    .eye-toggle {
      position: absolute;
      right: 0.75rem;
      top: 70%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #6b7280;
    }

    /* Call-to-action button */
    /* .cta-btn {
      margin-top: 2rem;
      background: #10b981;
      color: white;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .cta-btn:hover {
      background: #059669;
      transform: translateY(-2px);
    } */

  
    /* Hide default browser password reveal icon */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }
</style>
</head>
<body>

  <!-- Top scrolling news -->
  <div class="ticker-container">
    <div class="ticker-content">
      🛈 Note: This section is for course enrolled users to access live classes and recorded videos.
    </div>
  </div>

  <div class="login-card">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-4">Student Login</h2>

    <!-- Inside form scrolling note -->
    <div class="ticker-container">
      <div class="ticker-content">
        ⚠️ Username and password are already provided via email. Each username is valid for one user at a time. Do not share credentials.
      </div>
    </div>

    <!-- Login Form -->
    <form id="studentLoginForm" class="space-y-4 relative">
      <div>
        <label class="block text-gray-700 font-medium mb-1">Username</label>
        <input type="text" id="username" placeholder="Enter your username"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
      </div>

      <div class="relative">
        <label class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" id="password" placeholder="Enter your password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none pr-10" required>
        <span class="eye-toggle" id="togglePassword">
          <i class="fa-solid fa-eye-slash"></i>
        </span>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg transition duration-200">
        Login as Student
      </button>
    </form>

    <p class="mt-4 text-center text-gray-500 text-sm">
      Don't have credentials? Contact AGS Academy.
    </p>
  </div>

  <!-- Call-to-action below form -->
  <!-- <a href="signup.html" class="cta-btn">Enroll Now</a> -->

  <!-- Font Awesome for icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

  <script>
    // Password toggle
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const toggleIcon = togglePassword.querySelector('i');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggleIcon.classList.toggle('fa-eye');
      toggleIcon.classList.toggle('fa-eye-slash');
    });

    // Handle login
    const form = document.getElementById('studentLoginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!username || !password) {
        alert('Please fill all fields');
        return;
      }

      try {
        const res = await fetch('http://localhost:5000/api/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: username, password })
        });
        const data = await res.json();
        if (res.ok) {
          alert('Login successful!');
          window.location.href = 'dash.html';
        } else {
          alert(data.message || 'Login failed!');
        }
      } catch (err) {
        console.error(err);
        alert('Server error, try again!');
      }
    });
  </script>

</body>
</html>
