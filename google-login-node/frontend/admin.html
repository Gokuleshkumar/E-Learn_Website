<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - AGS Academys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #4f46e5, #6b21a8);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', sans-serif;
      padding: 1rem;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }

    .password-wrapper {
      position: relative;
    }

    .eye-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #6b7280;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .eye-toggle:hover {
      color: #4f46e5;
      transform: translateY(-50%) scale(1.2);
    }

    button[type="submit"] {
      transition: all 0.3s ease;
    }

    button[type="submit"]:hover {
      transform: translateY(-2px);
    }
  
    /* Hide default browser password reveal icon */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }
</style>
  <!-- Font Awesome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body>

  <div class="login-card">
    <h2 class="text-3xl font-bold text-gray-800 text-center mb-6">Admin Login</h2>
    
    <form id="adminLoginForm" class="space-y-4">
      <!-- Username -->
      <div>
        <label class="block text-gray-700 font-medium mb-1">Username</label>
        <input type="text" id="username" placeholder="Enter your username"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
      </div>

      <!-- Password -->
    <div class="password-wrapper relative">
  <label class="block text-gray-700 font-medium mb-1">Password</label>
  <input type="password" id="password" placeholder="Enter your password"
    class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" required>
  <span class="eye-toggle absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 cursor-pointer">
    <i class="fa-solid fa-eye"></i>
  </span>
</div>


      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-semibold">
        Login as Admin
      </button>
    </form>
  </div>

<script>
  // Password toggle with smooth animation
  const passwordInput = document.getElementById('password');
  const togglePassword = document.getElementById('togglePassword');
  const toggleIcon = togglePassword.querySelector('i');

  togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';

    // Animate icon rotation
    toggleIcon.classList.add('rotate-180');
    setTimeout(() => toggleIcon.classList.remove('rotate-180'), 200);

    // Toggle eye/eye-slash
    toggleIcon.classList.toggle('fa-eye');
    toggleIcon.classList.toggle('fa-eye-slash');
  });

  // Handle login
  const form = document.getElementById('adminLoginForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    if (!username || !password) {
      alert('Please fill all fields');
      return;
    }

    try {
      const res = await fetch('/api/admin-login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        alert('Login successful!');
        window.location.href = 'admin-dashboard.html';
      } else {
        alert(data.message || 'Login failed!');
      }
    } catch (err) {
      console.error(err);
      alert('Server error, try again!');
    }
  });
</script>

</body>
</html>
