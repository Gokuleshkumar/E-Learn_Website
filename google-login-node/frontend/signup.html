<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup - GK Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-md">
  <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Create Account</h2>

  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700">Name</label>
    <input id="name" type="text" placeholder="Enter your name"
      class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700">Email</label>
    <div class="flex space-x-2">
      <input id="email" type="email" placeholder="Enter your email"
        class="flex-1 mt-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
      <button id="getOtpBtn"
        class="px-3 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Get OTP</button>
    </div>
  </div>

  <div class="mb-4">
    <label class="block text-sm font-medium text-gray-700">OTP</label>
    <input id="otp" type="text" placeholder="Enter OTP"
      class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700">Password</label>
    <input id="password" type="password" placeholder="Enter your password"
      class="w-full mt-1 px-3 py-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
  </div>

  <p id="message" class="text-center text-sm mb-4"></p>

  <button id="signupBtn"
    class="w-full py-2 bg-green-600 text-white rounded-md hover:bg-green-700">Signup</button>

  <p class="text-center mt-4 text-sm text-gray-600">
    Already have an account?
    <a href="login.html" class="text-indigo-600 hover:underline">Login</a>
  </p>
</div>

<script>
const API_BASE = "http://localhost:5000";  // backend base URL
const messageEl = document.getElementById('message');
const getOtpBtn = document.getElementById('getOtpBtn');
const signupBtn = document.getElementById('signupBtn');

function showMessage(msg, color){
  messageEl.textContent = msg;
  messageEl.style.color = color || '#111827';
  messageEl.className = 'text-center text-sm mb-4 font-medium';
}

function startOtpCooldown(seconds = 60){
  getOtpBtn.disabled = true;
  const original = getOtpBtn.innerText;
  let s = seconds;
  getOtpBtn.innerText = `Resend (${s}s)`;
  const timer = setInterval(()=>{
    s--;
    if(s <= 0){
      clearInterval(timer);
      getOtpBtn.disabled = false;
      getOtpBtn.innerText = original;

      document.getElementById('otp').value = "";
      showMessage("OTP expired. Please request a new one.", "red");
    } else {
      getOtpBtn.innerText = `Resend (${s}s)`;
    }
  }, 1000);
}

// Request OTP
getOtpBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if(!email){ showMessage('Please enter an email', 'red'); return; }

  getOtpBtn.disabled = true;
  getOtpBtn.innerText = 'Sending...';
  showMessage('Sending OTP...', '#0ea5e9');

  try {
    const res = await fetch(`${API_BASE}/api/send-email-otp`, { // ✅ Updated route
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if(res.ok){
      showMessage(data.message || 'OTP sent', '#16a34a');
      startOtpCooldown(60);
      if(data.otp){
        console.log('DEV OTP (server returned):', data.otp);
      }
    } else {
      showMessage(data.message || 'Error sending OTP', 'red');
    }
  } catch(err){
    console.error(err);
    showMessage('Server error, try again!', 'red');
  } finally {
    if(!getOtpBtn.disabled){ getOtpBtn.innerText = 'Get OTP'; }
    else if(getOtpBtn.innerText === 'Sending...'){ getOtpBtn.innerText = 'Get OTP'; }
  }
});

// Signup
signupBtn.addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const otp = document.getElementById('otp').value.trim();

  if(!name || !email || !password || !otp){ showMessage('Fill all fields','red'); return; }

  signupBtn.disabled = true;
  signupBtn.innerText = 'Signing up...';
  showMessage('Signing up...', '#0ea5e9');

  try{
    const res = await fetch(`${API_BASE}/api/signup`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password, otp })
    });
    const data = await res.json();
    if(res.ok){
      showMessage(data.message || 'Signup successful', '#16a34a');

      localStorage.setItem('username', data.username || data.displayName || data.email);

      setTimeout(()=>window.location.href="dash.html",1500);
    } else {
      showMessage(data.message || 'Signup failed', 'red');
    }
  } catch(err){
    console.error(err);
    showMessage('Server error, try again!', 'red');
  } finally {
    signupBtn.disabled = false;
    signupBtn.innerText = 'Signup';
  }
});
</script>

</body>
</html>
