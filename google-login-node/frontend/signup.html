<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup - AGS Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #16a34a;
      --success-hover: #15803d;
      --bg-color: #f3f4f6;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --input-border: #d1d5db;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-color) url('bg_signup.png') no-repeat center center/cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .glass-container {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      transition: transform 0.3s ease;
    }

    .glass-container:hover {
      transform: translateY(-5px);
    }

    .title {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
    }

    .input-group {
      position: relative;
      margin-bottom: 24px;
    }

    .input-group.flex-group {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    .input-group.flex-group .input-wrapper {
      flex: 1;
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 16px 14px 8px;
      font-size: 16px;
      font-family: inherit;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.6);
      border: 2px solid transparent;
      border-bottom: 2px solid var(--input-border);
      border-radius: 12px 12px 0 0;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-field:focus {
      background: rgba(255, 255, 255, 0.9);
      border-bottom-color: var(--primary);
    }

    .floating-label {
      position: absolute;
      left: 14px;
      top: 14px;
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
      transition: 0.2s ease all;
      transform-origin: left top;
    }

    .input-field:focus ~ .floating-label,
    .input-field:not(:placeholder-shown) ~ .floating-label {
      top: 6px;
      left: 14px;
      font-size: 11px;
      font-weight: 600;
      color: var(--primary);
    }

    .input-field::placeholder {
      color: transparent;
    }

    button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--success);
      color: white;
      box-shadow: 0 4px 14px rgba(22, 163, 74, 0.4);
    }

    .btn-primary:hover {
      background: var(--success-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(22, 163, 74, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      padding: 0 20px;
      background: var(--primary);
      color: white;
      white-space: nowrap;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5);
    }
    
    .btn-secondary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary:disabled {
      background: #a5b4fc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #message {
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
      min-height: 20px;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .footer-text a:hover {
      color: var(--primary-hover);
      text-decoration: underline;
    }
  
    /* Hide default browser password reveal icon */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }
</style>
</head>
<body>

<div class="glass-container">
  <h2 class="title">Create Account</h2>

  <div class="input-group">
    <input id="name" type="text" class="input-field" placeholder="Name" autocomplete="name" required>
    <label class="floating-label">Full Name</label>
  </div>

  <div class="input-group flex-group">
    <div class="input-wrapper">
      <input id="email" type="email" class="input-field" placeholder="Email" autocomplete="email" required>
      <label class="floating-label">Email Address</label>
    </div>
    <button id="getOtpBtn" class="btn-secondary">Get OTP</button>
  </div>

  <div class="input-group">
    <input id="otp" type="text" class="input-field" placeholder="OTP" autocomplete="one-time-code" required>
    <label class="floating-label">Verification Code</label>
  </div>

  <div class="input-group">
    <input id="password" type="password" class="input-field" placeholder="Password" autocomplete="new-password" required>
    <label class="floating-label">Password</label>
  </div>

  <p id="message"></p>

  <button id="signupBtn" class="btn-primary">Sign Up</button>

  <p class="footer-text">
    Already have an account?
    <a href="login.html">Login</a>
  </p>
</div>

<script>
const API_BASE = "http://localhost:5000";  
const messageEl = document.getElementById('message');
const getOtpBtn = document.getElementById('getOtpBtn');
const signupBtn = document.getElementById('signupBtn');

function showMessage(msg, color){
  messageEl.textContent = msg;
  messageEl.style.color = color || 'var(--text-main)';
}

function startOtpCooldown(seconds = 60){
  getOtpBtn.disabled = true;
  const original = getOtpBtn.innerText;
  let s = seconds;
  getOtpBtn.innerText = `Resend (${s}s)`;
  const timer = setInterval(()=>{
    s--;
    if(s <= 0){
      clearInterval(timer);
      getOtpBtn.disabled = false;
      getOtpBtn.innerText = original;

      document.getElementById('otp').value = "";
      showMessage("OTP expired. Please request a new one.", "#dc2626"); // Red
    } else {
      getOtpBtn.innerText = `Resend (${s}s)`;
    }
  }, 1000);
}

// Request OTP
getOtpBtn.addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if(!email){ showMessage('Please enter an email address', '#dc2626'); return; }

  getOtpBtn.disabled = true;
  getOtpBtn.innerText = 'Sending...';
  showMessage('Sending OTP...', 'var(--primary)');

  try {
    const res = await fetch(`${API_BASE}/api/send-email-otp`, { 
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if(res.ok){
      showMessage(data.message || 'OTP sent successfully', 'var(--success)');
      startOtpCooldown(60);
      if(data.otp){
        console.log('DEV OTP (server returned):', data.otp);
      }
    } else {
      showMessage(data.message || 'Error sending OTP', '#dc2626');
    }
  } catch(err){
    console.error(err);
    showMessage('Server error, please try again!', '#dc2626');
  } finally {
    if(!getOtpBtn.disabled){ getOtpBtn.innerText = 'Get OTP'; }
    else if(getOtpBtn.innerText === 'Sending...'){ getOtpBtn.innerText = 'Get OTP'; }
  }
});

// Signup
signupBtn.addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const otp = document.getElementById('otp').value.trim();

  if(!name || !email || !password || !otp){ showMessage('Please fill in all fields','#dc2626'); return; }

  signupBtn.disabled = true;
  signupBtn.innerText = 'Signing up...';
  showMessage('Creating account...', 'var(--primary)');

  try{
    const res = await fetch(`${API_BASE}/api/signup`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name, email, password, otp })
    });
    const data = await res.json();
    if(res.ok){
      showMessage(data.message || 'Signup successful!', 'var(--success)');
      localStorage.setItem('username', data.username || data.displayName || data.email);
      setTimeout(()=>window.location.href="dash.html",1500);
    } else {
      showMessage(data.message || 'Signup failed', '#dc2626');
    }
  } catch(err){
    console.error(err);
    showMessage('Server error, please try again!', '#dc2626');
  } finally {
    signupBtn.disabled = false;
    signupBtn.innerText = 'Sign Up';
  }
});
</script>

</body>
</html>
