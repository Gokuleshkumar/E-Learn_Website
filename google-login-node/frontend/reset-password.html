<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - GK Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Toast container */
    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast-msg {
      position: relative;
      animation: slideIn 0.5s ease, fadeOut 0.5s ease 3.5s forwards;
      overflow: hidden;
      padding-right: 0.5rem;
    }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; transform: translateX(100%); } }

    /* Bottom line animation */
    .toast-line {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: rgba(255,255,255,0.8);
      animation: shrink 4s linear forwards;
    }
    @keyframes shrink { from { width: 100%; } to { width: 0%; } }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-r from-purple-600 to-pink-500">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold text-center mb-6 text-gray-800">Reset Password</h2>
    <p class="text-center text-gray-600 mb-6">Enter your new password below</p>

    <form id="resetForm" class="space-y-4">
      <input type="password" id="newPassword" placeholder="New Password"
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400" required>
      <input type="password" id="confirmPassword" placeholder="Confirm Password"
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-pink-400" required>
      <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-2 rounded-lg">
        Update Password
      </button>
    </form>

    <p class="text-sm text-center mt-4">
      <a href="./login.html" class="text-pink-600 hover:underline">Back to Login</a>
    </p>
  </div>

  <div id="toast"></div>

  <script>
    // Toast helper
    function showToast(message, type = "success") {
      const toastContainer = document.getElementById("toast");
      const toast = document.createElement("div");
      toast.className = `toast-msg px-4 py-2 rounded-lg shadow-lg text-white font-medium ${
        type === "success" ? "bg-green-500" : "bg-red-500"
      }`;
      toast.textContent = message;

      const line = document.createElement("div");
      line.className = "toast-line";
      toast.appendChild(line);

      toastContainer.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // Get token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    if (!token) {
      showToast("No reset token found!", "error");
      setTimeout(() => { window.location.href = './forgot-password.html'; }, 2000);
    }

    // Handle form submission
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!token) return;

      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();

      if (newPassword !== confirmPassword) {
        showToast("Passwords do not match!", "error");
        return;
      }

      try {
        const res = await fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const result = await res.json();

        if (res.ok) {
          showToast(result.message, "success");
          setTimeout(() => { window.location.href = './login.html'; }, 2000);
        } else {
          showToast(result.message, "error");
        }
      } catch (err) {
        console.error(err);
        showToast("Error connecting to server.", "error");
      }
    });
  </script>
</body>
</html>
