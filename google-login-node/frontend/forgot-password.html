<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - AGS Academys</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Toast container */
    #toast {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast-msg {
      position: relative;
      animation: slideIn 0.5s ease, fadeOut 0.5s ease 3.5s forwards;
      overflow: hidden;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; transform: translateX(100%); }
    }
    /* Bottom line animation */
    .toast-line {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 4px;
      background: rgba(255,255,255,0.8);
      animation: shrink 4s linear forwards;
    }
    @keyframes shrink {
      from { width: 100%; }
      to { width: 0%; }
    }
  
    /* Hide default browser password reveal icon */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none;
    }
</style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gradient-to-r from-indigo-500 to-purple-600">
  <div class="bg-white rounded-xl p-8 shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-4">Forgot Password?</h2>
    <p class="text-center text-gray-600 mb-6">Enter your email to reset password</p>

    <form id="forgotForm" class="space-y-4">
      <input type="email" id="email" placeholder="Enter your email"
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-400" required>
      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg">
        Submit
      </button>
    </form>

    <p class="text-sm text-center mt-4">
      <a href="./login.html" class="text-indigo-600 hover:underline">Back to Login</a>
    </p>
  </div>

  <!-- Toast container -->
  <div id="toast"></div>

<script>
function showToast(message, type = "success") {
  const toastContainer = document.getElementById("toast");

  const toast = document.createElement("div");
  toast.className = `toast-msg px-4 py-2 rounded-lg shadow-lg text-white font-medium ${
    type === "success" ? "bg-green-500" : "bg-red-500"
  }`;
  toast.textContent = message;

  // bottom animation line
  const line = document.createElement("div");
  line.className = "toast-line";
  toast.appendChild(line);

  toastContainer.appendChild(toast);

  // Auto remove after 4s
  setTimeout(() => {
    toast.remove();
  }, 4000);
}

document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();

  try {
 const res = await fetch('/api/forgot-password', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ email })
});


   

    const result = await res.json();

    if (res.ok) {
      showToast(result.message, "success");
      setTimeout(() => {
        window.location.href = result.resetLink;
      }, 1500);
    } else {
  showToast(result.message, "error");
}


  } catch (err) {
    console.error(err);
    showToast("Error connecting to server.", "error");
  }
});

</script>
