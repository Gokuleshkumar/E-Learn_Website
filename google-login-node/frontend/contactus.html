<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - GK Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Floating label animation */
    .input-container { position: relative; }
    .input-container input,
    .input-container textarea { padding-top: 1.25rem; }
    .input-container label {
      position: absolute;
      top: 0.75rem;
      left: 1rem;
      font-size: 1rem;
      color: #6B7280;
      pointer-events: none;
      transition: all 0.3s ease;
    }
    .input-container input:focus + label,
    .input-container input:not(:placeholder-shown) + label,
    .input-container textarea:focus + label,
    .input-container textarea:not(:placeholder-shown) + label {
      top: -0.5rem;
      left: 1rem;
      font-size: 0.75rem;
      color: #2563EB;
      font-weight: 500;
    }

    /* Fade-in animation */
    .fade-in {
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInUp 0.8s forwards;
    }
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

    /* Button hover animation */
    .btn-animated {
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    .btn-animated::after {
      content: "";
      position: absolute;
      width: 0;
      height: 100%;
      top: 0;
      left: 0;
      background: rgba(255,255,255,0.15);
      transition: all 0.3s ease;
    }
    .btn-animated:hover::after { width: 100%; }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Compact Header -->
  <header class="bg-gradient-to-r from-blue-600 to-indigo-600 py-12 text-center text-white fade-in">
    <h1 class="text-4xl md:text-4xl font-bold mb-2">Contact Us</h1>
    <p class="text-md md:text-lg max-w-xl mx-auto opacity-90">
      Questions about courses or enrollment? Fill out the form below and we’ll respond quickly.
    </p>
  </header>

  <!-- Contact Section -->
  <main class="max-w-4xl mx-auto px-6 py-12 grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

    <!-- Info Panel -->
    <div class="fade-in" style="animation-delay: 0.2s;">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">We’re Here to Help</h2>
      <p class="text-gray-600 mb-4">
        For course inquiries, schedules, or support, reach out to us. We respond within 24 hours.
      </p>
      <p class="font-semibold text-gray-700">📧 gkacademy1234@gmail.com</p>
    </div>

    <!-- Form Panel -->
    <div class="bg-white rounded-2xl shadow-md p-8 fade-in" style="animation-delay: 0.4s;">
      <form class="space-y-4">

        <!-- Full Name -->
        <div class="input-container">
          <input type="text" placeholder=" " class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
          <label>Full Name</label>
        </div>

        <!-- Email -->
        <div class="input-container">
          <input type="email" placeholder=" " class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
          <label>Email Address</label>
        </div>

        <!-- Message -->
        <div class="input-container">
          <textarea rows="4" placeholder=" " class="w-full border border-gray-300 rounded-xl px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"></textarea>
          <label>Your Message</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-animated w-full bg-blue-600 text-white py-2 rounded-xl font-semibold shadow hover:bg-blue-700 transition">
          Send Message
        </button>
      </form>
    </div>

  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-gray-500 text-sm fade-in" style="animation-delay: 0.6s;">
    &copy; 2025 GK Academy. All rights reserved.
  </footer>

</body>
</html>
