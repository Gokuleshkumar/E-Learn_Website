<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - GK Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .glass {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease forwards;
      transform: translateY(20px);
      opacity: 0;
    }
    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .underline-animate {
      display: inline-block;
      position: relative;
    }
    .underline-animate::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      width: 100%;
      background-color: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      animation: underlineAnim 2s forwards;
    }
    @keyframes underlineAnim {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    /* ✅ Google Button */
    .google-signin {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px 16px;
      background: #ffffff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #3c4043;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: all 0.25s ease;
    }
    .google-signin img {
      width: 20px;
      height: 20px;
    }
    .google-signin:hover {
      background: #f7f8f9;
      transform: translateY(-1px);
      box-shadow: 0 5px 12px rgba(0,0,0,0.15);
    }
  </style>
  <!-- ✅ Font Awesome for professional icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          keyframes: {
            slideIn: {
              '0%': { transform: 'translateX(100%)', opacity: '0' },
              '100%': { transform: 'translateX(0)', opacity: '1' },
            },
            slideOut: {
              '0%': { transform: 'translateX(0)', opacity: '1' },
              '100%': { transform: 'translateX(100%)', opacity: '0' },
            },
          },
          animation: {
            slideIn: 'slideIn 0.5s ease-out forwards',
            slideOut: 'slideOut 0.5s ease-in forwards',
          },
        }
      }
    }
  </script>
</head>
<body>
  <!-- Toast container -->
  <div id="toastContainer" class="fixed top-5 right-5 space-y-2 z-50"></div>

  <div class="glass w-full max-w-md p-8">
    <h2 class="text-3xl font-bold text-white text-center mb-6">Welcome Back 👋</h2>
    <form id="loginForm" class="space-y-4">
      <!-- Email -->
      <div>
        <label class="block text-white mb-1 font-semibold">Email</label>
        <input name="email" type="email" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-300" placeholder="Enter your email" required>
      </div>

      <!-- Password -->
      <div class="relative">
        <label class="block text-white mb-1 font-semibold">Password</label>
        <input id="password" name="password" type="password" class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-300 pr-10" placeholder="Enter your password" required>

        <!-- Eye toggle button -->
        <button type="button" id="togglePassword" class="absolute top-9 right-3 text-black-100">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>

      <!-- Forgot Password -->
      <div class="text-right">
        <a href="forgot-password.html" class="text-sm text-indigo-200 hover:underline">Forgot Password?</a>
      </div>

      <!-- Login button -->
      <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white py-2 rounded-lg transition transform hover:scale-105">Login</button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6 text-white">
      <hr class="flex-grow border-white/30">
      <span class="mx-3">OR</span>
      <hr class="flex-grow border-white/30">
    </div>

    <!-- ✅ New Google Sign-In -->
    <button 
      onclick="window.location.href='http://localhost:5000/auth/google'" 
      class="google-signin"
    >
      <img src="https://www.svgrepo.com/show/355037/google.svg" alt="Google logo" />
      <span>Sign in with Google</span>
    </button>

    <p class="mt-6 text-center text-white text-sm">Don't have an account? 
      <a href="signup.html" class="text-indigo-200 hover:underline">Sign Up</a>
    </p>
  </div>

<script>
  
  // ✅ Password toggle with Font Awesome icons
  const passwordInput = document.getElementById('password');
  const togglePassword = document.getElementById('togglePassword');
  const toggleIcon = togglePassword.querySelector('i');

  togglePassword.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleIcon.classList.toggle('fa-eye');
    toggleIcon.classList.toggle('fa-eye-slash');
  });

  

  // ✅ Toast function
  function showToast(message, type = "success") {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    const base = "flex items-center gap-2 px-4 py-2 rounded-lg shadow-lg animate-slideIn text-white";
    toast.className = `${base} ${type === "success" ? "bg-green-500" : "bg-red-500"}`;
    toast.innerHTML = type === "success" 
      ? `<i class="fa-solid fa-check-circle"></i><span class="underline-animate">${message}</span>`
      : `<i class="fa-solid fa-xmark-circle"></i><span class="underline-animate">${message}</span>`;
    container.prepend(toast);
    setTimeout(() => {
      toast.classList.add('animate-slideOut');
      toast.addEventListener('animationend', () => toast.remove());
    }, 3000);
  }

  // ✅ Handle login
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const data = { email: formData.get('email'), password: formData.get('password') };
    try {
      const res = await fetch('http://localhost:5000/api/login', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      if (res.ok) {
    showToast('Login Successful!', 'success');

    // ✅ Store username in localStorage for dash.html
    localStorage.setItem('username', result.username || result.displayName || result.email);

    setTimeout(() => window.location.href = 'dash.html', 1500);
}
else {
        showToast(result.message || 'Invalid Credentials!', 'error');
      }
    } catch (err) {
      console.error(err);
      showToast('An error occurred.', 'error');
    }
  });
</script>
</body>
</html>
