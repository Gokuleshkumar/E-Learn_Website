<svg xmlns="http://www.svg.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e13" />
      <stop offset="100%" stop-color="#181528" />
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" rx="36" fill="url(#bgGrad)" />
  
  <!-- Emblem with glow -->
  <g transform="translate(68, 42) scale(1.65)" filter="url(#glow)">
    <path d="M20 70 L45 20 L70 70 M32 45 L58 45" stroke="url(#logoGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="45" cy="20" r="7" fill="#8B5CF6" />
    <circle cx="20" cy="70" r="7" fill="#3b82f6" />
    <circle cx="70" cy="70" r="7" fill="#3b82f6" />
  </g>
  
  <!-- Text Brand -->
  <text x="150" y="235" font-family="'Segoe UI', Roboto, Inter, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="1">
    AGS <tspan fill="#8B5CF6">ACADEMYS</tspan>
  </text>
  <text x="150" y="260" font-family="'Segoe UI', Roboto, Inter, Helvetica, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#94A3B8" letter-spacing="3">
    ONLINE TECH LEARNING
  </text>
</svg>
